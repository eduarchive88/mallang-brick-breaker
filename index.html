<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>말랑 벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe9f3;
    --bg2: #e6f0ff;
    --ink: #6b4a5e;
    --pink: #ff8fb8;
    --card: #fffafc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 12px 16px;
  }
  #hud {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 20px; margin-bottom: 8px;
  }
  #hud .pill {
    background: var(--card); border-radius: 999px; padding: 4px 14px;
    box-shadow: 0 3px 0 #f3c6d8;
  }
  #stage { position: relative; }
  canvas {
    display: block; border-radius: 24px;
    box-shadow: 0 8px 0 #f3c6d8, 0 16px 40px rgba(255, 143, 184, .3);
    background: #fff;
    cursor: none;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; border-radius: 24px;
    background: rgba(255, 245, 250, .82);
    backdrop-filter: blur(3px);
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 44px; margin: 0 0 4px; color: var(--pink); text-shadow: 0 3px 0 #fff; font-weight: normal; }
  #overlay .face { font-size: 54px; margin-bottom: 6px; }
  #overlay p { margin: 6px 0; font-size: 18px; line-height: 1.5; }
  #overlay .small { font-size: 15px; opacity: .75; }
  #overlay button {
    margin-top: 16px; font-family: inherit; font-size: 22px;
    color: #fff; background: var(--pink); border: 0; border-radius: 999px;
    padding: 12px 32px; cursor: pointer;
    box-shadow: 0 5px 0 #e0679a; transition: transform .08s;
  }
  #overlay button:active { transform: translateY(4px); box-shadow: 0 1px 0 #e0679a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="hud">
      <span class="pill" id="score">점수 0</span>
      <span class="pill" id="level">스테이지 1</span>
      <span class="pill" id="lives">♥♥♥</span>
    </div>
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="face">(｡•ᴗ•｡)</div>
      <h1>말랑 벽돌깨기</h1>
      <p>말랑말랑 젤리 친구들을 톡톡 깨 주세요!</p>
      <p class="small">마우스·터치로 움직이기 / ← → 키<br>클릭·탭·스페이스로 공 발사<br>떨어지는 사탕을 받으면 선물이 있어요 🍬</p>
      <p class="small" id="best"></p>
      <button id="btn">시작하기</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 480, H = 640;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const btn = document.getElementById('btn');
  const $score = document.getElementById('score');
  const $level = document.getElementById('level');
  const $lives = document.getElementById('lives');
  const $best = document.getElementById('best');

  // ---------- 화면 크기 ----------
  let scale = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const maxW = window.innerWidth - 32;
    const maxH = window.innerHeight - 24 - 50;
    scale = Math.min(maxW / W, maxH / H, 1.4);
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = W * scale * dpr;
    cv.height = H * scale * dpr;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    document.getElementById('hud').style.width = W * scale + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 저장 ----------
  function loadBest() { try { return +localStorage.getItem('mallang-best') || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('mallang-best', v); } catch (e) {} }
  let best = loadBest();
  function showBest() { $best.textContent = best ? `최고 점수 ${best}` : ''; }
  showBest();

  // ---------- 소리 ----------
  let ac = null;
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.12) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, ac.currentTime + dur);
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }
  const notes = [523, 587, 659, 698, 784, 880, 988, 1047];
  let combo = 0;

  // ---------- 색 ----------
  const JELLY = [
    { fill: '#ffb3c7', dark: '#f28aa8' }, // 딸기
    { fill: '#ffd59e', dark: '#f5b56a' }, // 오렌지
    { fill: '#fff0a0', dark: '#ecd668' }, // 레몬
    { fill: '#b8f0c2', dark: '#84d899' }, // 멜론
    { fill: '#aee0ff', dark: '#7cc3f0' }, // 소다
    { fill: '#d7c2ff', dark: '#b297f2' }, // 포도
  ];
  const HARD = { fill: '#ffffff', dark: '#d9c9d3' };

  // ---------- 스테이지 ----------
  // 0 = 빈칸, 1~6 = 젤리 색, 9 = 단단한 젤리(2번)
  const STAGES = [
    [
      '00000000',
      '11111111',
      '22222222',
      '33333333',
      '44444444',
      '55555555',
    ],
    [
      '01100110',
      '12211221',
      '13333331',
      '01444410',
      '00155100',
      '00011000',
    ],
    [
      '99999999',
      '10203040',
      '05060102',
      '30405060',
      '01020304',
      '50601020',
    ],
    [
      '00066000',
      '00655600',
      '06544560',
      '65439456',
      '06544560',
      '00655600',
      '00066000',
    ],
    [
      '19191919',
      '22222222',
      '93939393',
      '44444444',
      '95959595',
      '66666666',
      '11111111',
    ],
  ];
  const COLS = 8, BW = 52, BH = 26, GAP = 6;
  const OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OY = 70;

  // ---------- 상태 ----------
  let bricks = [], balls = [], items = [], parts = [], floaters = [];
  let paddle, score, lives, stage, state = 'menu', loop = 0;
  let keys = {}, t = 0, shake = 0;

  function makePaddle() {
    return { x: W / 2, y: H - 60, w: 96, h: 18, wideT: 0, squish: 0 };
  }

  function buildStage(n) {
    const map = STAGES[n % STAGES.length];
    bricks = [];
    map.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '0') return;
        const hard = ch === '9';
        const col = hard ? HARD : JELLY[(+ch - 1) % JELLY.length];
        bricks.push({
          x: OX + c * (BW + GAP), y: OY + r * (BH + GAP), w: BW, h: BH,
          hp: hard ? 2 : 1, hard, col, wob: 0, blink: Math.random() * 300,
          phase: Math.random() * Math.PI * 2,
        });
      });
    });
  }

  function baseSpeed() { return 5.2 + Math.min(stage, 8) * 0.35; }

  function newBall(stuck = true) {
    return { x: paddle.x, y: paddle.y - 14, r: 9, vx: 0, vy: 0, stuck, spin: 0, trail: [] };
  }

  function launch(b) {
    const a = (-Math.PI / 2) + (Math.random() - 0.5) * 0.6;
    const s = baseSpeed();
    b.vx = Math.cos(a) * s; b.vy = Math.sin(a) * s; b.stuck = false;
    beep(660, 0.1, 'triangle');
  }

  function startGame() {
    score = 0; lives = 3; stage = 0;
    paddle = makePaddle();
    buildStage(stage);
    balls = [newBall()]; items = []; parts = []; floaters = [];
    state = 'play';
    hideOverlay(); updateHud();
  }

  function nextStage() {
    stage++;
    paddle = makePaddle();
    buildStage(stage);
    balls = [newBall()]; items = [];
    state = 'play';
    hideOverlay(); updateHud();
  }

  function updateHud() {
    $score.textContent = `점수 ${score}`;
    $level.textContent = `스테이지 ${stage + 1}`;
    $lives.textContent = lives > 0 ? '♥'.repeat(Math.min(lives, 6)) : '♡';
  }

  function showOverlay(face, title, msgs, btnText) {
    overlay.querySelector('.face').textContent = face;
    overlay.querySelector('h1').textContent = title;
    overlay.querySelectorAll('p').forEach(p => p.remove());
    msgs.forEach(([txt, cls]) => {
      const p = document.createElement('p');
      if (cls) p.className = cls;
      p.innerHTML = txt;
      overlay.insertBefore(p, btn);
    });
    btn.textContent = btnText;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (state === 'menu' || state === 'over') startGame();
    else if (state === 'clear') nextStage();
  });

  // ---------- 입력 ----------
  function pointerX(e) {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) / scale;
  }
  cv.addEventListener('pointermove', e => { if (paddle && state === 'play') paddle.x = pointerX(e); });
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    paddle.x = pointerX(e);
    balls.forEach(b => b.stuck && launch(b));
  });
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state === 'play') balls.forEach(b => b.stuck && launch(b));
      else btn.click();
    }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // ---------- 효과 ----------
  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.5;
      parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5,
        life: 1, color, size: 4 + Math.random() * 5,
        kind: Math.random() < 0.4 ? 'heart' : Math.random() < 0.5 ? 'star' : 'dot',
        rot: Math.random() * 6,
      });
    }
  }
  function floatText(x, y, text, color = '#ff6fa3') {
    floaters.push({ x, y, text, color, life: 1 });
  }

  // ---------- 아이템 ----------
  const ITEM_TYPES = [
    { type: 'wide', label: '넓게!', color: '#ffb3c7' },
    { type: 'multi', label: '공 셋!', color: '#aee0ff' },
    { type: 'life', label: '하트+1', color: '#ff8fb8' },
    { type: 'slow', label: '느릿느릿', color: '#b8f0c2' },
  ];
  function dropItem(x, y) {
    if (Math.random() > 0.16) return;
    let pool = ITEM_TYPES;
    if (Math.random() < 0.6) pool = ITEM_TYPES.filter(i => i.type !== 'life');
    const it = pool[Math.floor(Math.random() * pool.length)];
    items.push({ ...it, x, y, vy: 2.2, rot: 0 });
  }
  function applyItem(it) {
    beep(880, 0.15, 'triangle'); beep(1175, 0.2, 'sine', 0.08);
    floatText(it.x, paddle.y - 20, it.label, '#e0679a');
    if (it.type === 'wide') paddle.wideT = 60 * 12;
    else if (it.type === 'life') { lives++; updateHud(); }
    else if (it.type === 'slow') balls.forEach(b => { if (!b.stuck) setSpeed(b, Math.max(3.5, speedOf(b) * 0.7)); });
    else if (it.type === 'multi') {
      const src = balls.find(b => !b.stuck) || balls[0];
      if (src.stuck) launch(src);
      const add = [];
      for (const d of [-0.5, 0.5]) {
        const nb = newBall(false);
        nb.x = src.x; nb.y = src.y;
        const a = Math.atan2(src.vy, src.vx) + d, s = speedOf(src);
        nb.vx = Math.cos(a) * s; nb.vy = Math.sin(a) * s;
        add.push(nb);
      }
      balls.push(...add);
    }
  }
  const speedOf = b => Math.hypot(b.vx, b.vy);
  function setSpeed(b, s) { const k = s / (speedOf(b) || 1); b.vx *= k; b.vy *= k; }

  // ---------- 업데이트 ----------
  function update() {
    t++;
    if (state !== 'play') { updateParts(); return; }

    // 패들
    const targetW = paddle.wideT > 0 ? 150 : 96;
    paddle.w += (targetW - paddle.w) * 0.15;
    if (paddle.wideT > 0) paddle.wideT--;
    if (keys['ArrowLeft'] || keys['a']) paddle.x -= 8;
    if (keys['ArrowRight'] || keys['d']) paddle.x += 8;
    paddle.x = Math.max(paddle.w / 2 + 6, Math.min(W - paddle.w / 2 - 6, paddle.x));
    paddle.squish *= 0.85;

    // 공
    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - b.r; continue; }
      b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 8) b.trail.shift();
      b.spin += b.vx * 0.03;
      const steps = Math.ceil(speedOf(b) / 3);
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps; b.y += b.vy / steps;
        // 벽
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(400, 0.04); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(400, 0.04); }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); beep(400, 0.04); }
        // 패들
        const px = paddle.x - paddle.w / 2, py = paddle.y - paddle.h / 2;
        if (b.vy > 0 && b.y + b.r >= py && b.y - b.r <= py + paddle.h && b.x >= px - b.r && b.x <= px + paddle.w + b.r) {
          const hit = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
          const ang = -Math.PI / 2 + hit * 1.05;
          const sp = Math.min(speedOf(b) * 1.01, baseSpeed() + 2.5);
          b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
          b.y = py - b.r;
          paddle.squish = 1; combo = 0;
          beep(330, 0.08, 'triangle');
        }
        // 벽돌
        for (const br of bricks) {
          if (br.hp <= 0) continue;
          const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
          const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
          const dx = b.x - cx, dy = b.y - cy;
          if (dx * dx + dy * dy > b.r * b.r) continue;
          // 반사 방향
          const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
          const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
          if (ox < oy) { b.vx = b.x < br.x + br.w / 2 ? -Math.abs(b.vx) : Math.abs(b.vx); }
          else { b.vy = b.y < br.y + br.h / 2 ? -Math.abs(b.vy) : Math.abs(b.vy); }
          hitBrick(br);
          break;
        }
      }
    }
    // 바닥으로 떨어진 공
    balls = balls.filter(b => b.y - b.r < H + 10);
    if (balls.length === 0) loseLife();

    // 너무 수평인 공 보정
    for (const b of balls) {
      if (!b.stuck && Math.abs(b.vy) < 1.2) { b.vy = b.vy < 0 ? -1.6 : 1.6; }
    }

    // 아이템
    for (const it of items) {
      it.y += it.vy; it.rot += 0.08;
      if (Math.abs(it.x - paddle.x) < paddle.w / 2 + 12 && Math.abs(it.y - paddle.y) < 18) {
        it.got = true; applyItem(it);
      }
    }
    items = items.filter(it => !it.got && it.y < H + 20);

    for (const br of bricks) { br.wob *= 0.88; }
    updateParts();

    if (bricks.every(b => b.hp <= 0)) stageClear();
  }

  function hitBrick(br) {
    br.hp--; br.wob = 1;
    combo++;
    const n = notes[Math.min(combo - 1, notes.length - 1)];
    if (br.hp > 0) {
      beep(n * 0.75, 0.08, 'square', 0.06);
      burst(br.x + br.w / 2, br.y + br.h / 2, '#e8d8e0', 4);
      return;
    }
    beep(n, 0.12, 'triangle');
    const pts = (br.hard ? 30 : 10) * Math.min(combo, 8);
    score += pts; updateHud();
    burst(br.x + br.w / 2, br.y + br.h / 2, br.col.dark, 12);
    if (combo >= 3) floatText(br.x + br.w / 2, br.y, `${combo}콤보! +${pts}`);
    shake = 4;
    dropItem(br.x + br.w / 2, br.y + br.h / 2);
  }

  function loseLife() {
    lives--; updateHud(); combo = 0;
    beep(300, 0.25, 'sawtooth', 0.06); beep(200, 0.35, 'sine', 0.1);
    shake = 10;
    if (lives <= 0) {
      state = 'over';
      if (score > best) { best = score; saveBest(best); }
      showBest();
      showOverlay('(｡•́︿•̀｡)', '앗, 아쉬워요!', [
        [`점수 <b>${score}</b> · 스테이지 ${stage + 1}`],
        [`최고 점수 ${best}`, 'small'],
      ], '다시 하기');
      return;
    }
    paddle.wideT = 0; items = [];
    balls = [newBall()];
  }

  function stageClear() {
    state = 'clear';
    const bonus = 100 * (stage + 1);
    score += bonus; updateHud();
    for (let i = 0; i < 6; i++) burst(80 + Math.random() * 320, 200 + Math.random() * 200, JELLY[i].dark, 14);
    [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle'), i * 110));
    if (score > best) { best = score; saveBest(best); }
    const looped = (stage + 1) % STAGES.length === 0;
    showOverlay('ヽ(＾▽＾)ノ', `스테이지 ${stage + 1} 클리어!`, [
      [`보너스 +${bonus} · 점수 <b>${score}</b>`],
      [looped ? '모든 스테이지를 깼어요! 이제 더 빨라져요 ✨' : '다음 젤리 친구들이 기다려요', 'small'],
    ], '다음 스테이지');
  }

  function updateParts() {
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.022; p.rot += 0.1; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floaters) { f.y -= 0.8; f.life -= 0.018; }
    floaters = floaters.filter(f => f.life > 0);
    shake *= 0.85;
  }

  // ---------- 그리기 ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function heart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s, y - s * 0.4, x - s * 0.4, y - s, x, y - s * 0.35);
    ctx.bezierCurveTo(x + s * 0.4, y - s, x + s, y - s * 0.4, x, y + s * 0.35);
    ctx.fill();
  }
  function star(x, y, s) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? s * 0.45 : s;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  }

  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * 120, s: 0.6 + Math.random() * 0.6, v: 0.1 + Math.random() * 0.15 }));
  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#fff3f8'); g.addColorStop(1, '#eef4ff');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    // 땡땡이
    ctx.fillStyle = 'rgba(255, 182, 210, 0.18)';
    for (let y = 0; y < H; y += 40) for (let x = (y / 40) % 2 * 20; x < W; x += 40) {
      ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
    }
    // 구름
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) {
      c.x += c.v; if (c.x > W + 80) c.x = -80;
      const s = c.s;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * s, 0, 7);
      ctx.arc(c.x + 24 * s, c.y - 10 * s, 26 * s, 0, 7);
      ctx.arc(c.x + 50 * s, c.y, 20 * s, 0, 7);
      ctx.fill();
    }
  }

  function drawFace(cx, cy, s, mood, blink) {
    ctx.fillStyle = '#5a3d4f';
    ctx.strokeStyle = '#5a3d4f';
    ctx.lineWidth = 1.8 * s; ctx.lineCap = 'round';
    const ex = 7 * s;
    if (mood === 'ouch') {
      // >_<
      for (const d of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(cx + d * ex - 3 * s * d, cy - 4 * s);
        ctx.lineTo(cx + d * ex + 2 * s * d, cy - 1.5 * s);
        ctx.lineTo(cx + d * ex - 3 * s * d, cy + 1 * s);
        ctx.stroke();
      }
    } else if (blink) {
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(cx + d * ex - 2.5 * s, cy - 1.5 * s); ctx.lineTo(cx + d * ex + 2.5 * s, cy - 1.5 * s); ctx.stroke(); }
    } else {
      for (const d of [-1, 1]) {
        ctx.beginPath(); ctx.arc(cx + d * ex, cy - 1.5 * s, 2.3 * s, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + d * ex + 0.8 * s, cy - 2.3 * s, 0.8 * s, 0, 7); ctx.fill();
        ctx.fillStyle = '#5a3d4f';
      }
    }
    // 입
    ctx.beginPath();
    if (mood === 'ouch') { ctx.arc(cx, cy + 4 * s, 2 * s, 0, 7); ctx.fill(); }
    else { ctx.arc(cx - 1.6 * s, cy + 1.5 * s, 1.6 * s, 0.1, Math.PI - 0.1); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 1.6 * s, cy + 1.5 * s, 1.6 * s, 0.1, Math.PI - 0.1); ctx.stroke(); }
    // 볼터치
    ctx.fillStyle = 'rgba(255, 120, 160, 0.45)';
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(cx + d * 12 * s, cy + 2.5 * s, 3.5 * s, 2.2 * s, 0, 0, 7); ctx.fill(); }
  }

  function drawBricks() {
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      const bob = Math.sin(t * 0.05 + br.phase) * 1.2;
      const sx = 1 + br.wob * 0.12, sy = 1 - br.wob * 0.12;
      const cx = br.x + br.w / 2, cy = br.y + br.h / 2 + bob;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(sx, sy);
      // 그림자
      ctx.fillStyle = br.col.dark;
      rr(-br.w / 2, -br.h / 2 + 3, br.w, br.h, 10); ctx.fill();
      // 몸통
      ctx.fillStyle = br.col.fill;
      rr(-br.w / 2, -br.h / 2, br.w, br.h, 10); ctx.fill();
      if (br.hard) {
        ctx.strokeStyle = br.hp === 2 ? '#e9b4cb' : '#f6c8da';
        ctx.lineWidth = 2; ctx.setLineDash(br.hp === 2 ? [] : [4, 3]);
        rr(-br.w / 2 + 2, -br.h / 2 + 2, br.w - 4, br.h - 4, 8); ctx.stroke();
        ctx.setLineDash([]);
      }
      // 반짝이
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      rr(-br.w / 2 + 5, -br.h / 2 + 3, br.w * 0.35, 5, 3); ctx.fill();
      const blink = ((t + br.blink) % 240) < 8;
      drawFace(0, 1, 0.75, br.wob > 0.2 || (br.hard && br.hp === 1) ? 'ouch' : 'happy', blink);
      ctx.restore();
    }
  }

  function drawPaddle() {
    const p = paddle;
    const sq = p.squish;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(1 + sq * 0.06, 1 - sq * 0.25);
    const w = p.w, h = p.h;
    // 귀
    ctx.fillStyle = '#ff8fb8';
    for (const d of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(d * (w / 2 - 22), -h / 2 + 2);
      ctx.lineTo(d * (w / 2 - 14), -h / 2 - 12);
      ctx.lineTo(d * (w / 2 - 6), -h / 2 + 2);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#e0679a';
    rr(-w / 2, -h / 2 + 4, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#ff8fb8';
    rr(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    rr(-w / 2 + 10, -h / 2 + 3, w - 20, 4, 2); ctx.fill();
    // 얼굴
    ctx.fillStyle = '#5a3d4f';
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(d * 9, 0, 2.2, 0, 7); ctx.fill(); }
    ctx.strokeStyle = '#5a3d4f'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-2, 2.5, 2, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(2, 2.5, 2, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(d * 17, 3, 4, 2.5, 0, 0, 7); ctx.fill(); }
    ctx.restore();
  }

  function drawBalls() {
    for (const b of balls) {
      b.trail.forEach((tp, i) => {
        ctx.fillStyle = `rgba(255, 200, 120, ${(i + 1) / b.trail.length * 0.25})`;
        ctx.beginPath(); ctx.arc(tp.x, tp.y, b.r * (i + 1) / b.trail.length, 0, 7); ctx.fill();
      });
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = '#ffd36e';
      ctx.beginPath(); ctx.arc(0, 0, b.r + 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(0, 0, b.r - 0.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#5a3d4f';
      ctx.beginPath(); ctx.arc(-3, -1, 1.5, 0, 7); ctx.arc(3, -1, 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,160,.6)';
      ctx.beginPath(); ctx.arc(-5.5, 2, 1.6, 0, 7); ctx.arc(5.5, 2, 1.6, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  function drawItems() {
    for (const it of items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(Math.sin(it.rot) * 0.3);
      // 사탕 포장
      ctx.fillStyle = it.color;
      for (const d of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(d * 9, 0); ctx.lineTo(d * 19, -7); ctx.lineTo(d * 19, 7); ctx.closePath(); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, 4.5); ctx.stroke();
      if (it.type === 'life') { ctx.fillStyle = '#fff'; heart(0, 1, 6); }
      ctx.restore();
    }
  }

  function drawParts() {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      if (p.kind === 'heart') heart(p.x, p.y, p.size);
      else if (p.kind === 'star') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); star(0, 0, p.size); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
    ctx.font = '18px Jua, sans-serif';
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawHint() {
    if (state === 'play' && balls.some(b => b.stuck)) {
      ctx.textAlign = 'center';
      ctx.font = '20px Jua, sans-serif';
      ctx.globalAlpha = 0.6 + Math.sin(t * 0.08) * 0.3;
      ctx.fillStyle = '#e0679a';
      ctx.fillText('탭하거나 스페이스를 눌러 발사!', W / 2, H - 120);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBg();
    drawBricks();
    if (paddle) { drawItems(); drawPaddle(); drawBalls(); }
    drawParts();
    drawHint();
    ctx.restore();
  }

  // 메뉴 화면용 미리보기
  paddle = makePaddle(); stage = 0; score = 0; lives = 3;
  buildStage(0); balls = [newBall()];

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
